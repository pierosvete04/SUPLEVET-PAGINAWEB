<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<!-- Fija dónde resuelve el navegador los href/src relativos de esta página
     (assets/…, manifest.json), sin importar si la URL en la barra de
     direcciones trae o no la barra final. Necesario porque este portal vive
     anidado en /b2b/vendors/ dentro del sitio principal, no en la raíz del
     dominio. Debe ir antes que cualquier otro href/src relativo del <head>. -->
<base href="/b2b/vendors/"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Portal Suplevet — Ingresar</title>

<meta name="theme-color" content="#253C61"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Suplevet"/>

<link rel="icon" type="image/png" href="assets/img/icon-192.png"/>
<link rel="apple-touch-icon" href="assets/img/icon-192.png"/>
<link rel="manifest" href="manifest.json"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://bcahhdszzwearqaafhpa.supabase.co"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260803-uxfix"/>
<link rel="stylesheet" href="assets/css/login.css?v=20260803-uxfix"/>
</head>
<body>

<!-- Pantalla de arranque: se muestra mientras comprobamos si ya hay sesión.
     Evita el parpadeo del formulario para quien ya está dentro. -->
<div class="boot" id="boot">
  <img src="assets/img/icon-192.png" alt=""/>
  <div class="spinner" role="status" aria-label="Comprobando tu sesión"></div>
  <p>Comprobando tu sesión…</p>
</div>

<main class="stage" id="stage" hidden>
  <div class="card">
    <div class="brand">
      <img src="assets/img/icon-192.png" alt="Suplevet"/>
      <h1>Suplevet</h1>
      <p>Portal interno de ventas</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          type="text"
          id="email"
          name="email"
          inputmode="email"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="nombre@suplevet.com"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          required
        />
      </div>

      <label class="remember" for="remember">
        <input type="checkbox" id="remember" name="remember" checked/>
        Mantener la sesión abierta en este dispositivo
      </label>

      <button type="submit" class="submit" id="submit">Ingresar</button>

      <p class="msg error" id="error" role="alert" hidden></p>
      <p class="msg success" id="success" role="status" hidden></p>
    </form>

    <p class="foot">Acceso restringido al equipo de Suplevet</p>
  </div>
</main>

<script>
// Scope relativo ('./'), no '/': el portal ahora vive bajo /b2b/vendors/ en
// vez de la raíz del dominio, y un scope '/' intentaría (y fallaría, porque
// el navegador no lo permite fuera del directorio del script) controlar
// también el sitio principal de suplevet.pe.
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});}
</script>
<script src="assets/js/session.js?v=20260817-baja2"></script>
<script>
(function () {
  'use strict';

  var boot    = document.getElementById('boot');
  var stage   = document.getElementById('stage');
  var form    = document.getElementById('login-form');
  var email   = document.getElementById('email');
  var pass    = document.getElementById('password');
  var remember= document.getElementById('remember');
  var submit  = document.getElementById('submit');
  var errorEl = document.getElementById('error');
  var okEl    = document.getElementById('success');

  // Mensajes por código de error. Cada uno dice qué pasó y qué hacer,
  // en vez de devolver el código HTTP crudo como hacían los paneles viejos.
  var MESSAGES = {
    bad_credentials: 'El correo o la contraseña no coinciden. Revísalos e inténtalo otra vez.',
    no_role: 'Tu cuenta existe pero todavía no tiene un panel asignado. Pídele a un administrador que te dé acceso.',
    baja: 'Te han dado de baja. Tu acceso a este panel fue desactivado — si crees que es un error, contacta a un administrador.',
    network: 'No pudimos conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.',
    empty: 'Escribe tu correo y tu contraseña para continuar.'
  };

  function showError(code) {
    okEl.hidden = true;
    errorEl.textContent = MESSAGES[code] || MESSAGES.network;
    errorEl.hidden = false;
    var invalid = (code === 'bad_credentials' || code === 'empty');
    email.setAttribute('aria-invalid', invalid ? 'true' : 'false');
    pass.setAttribute('aria-invalid', invalid ? 'true' : 'false');
  }

  function clearError() {
    errorEl.hidden = true;
    email.setAttribute('aria-invalid', 'false');
    pass.setAttribute('aria-invalid', 'false');
  }

  function setBusy(busy) {
    submit.disabled = busy;
    submit.textContent = busy ? 'Verificando…' : 'Ingresar';
  }

  function showLogin() {
    boot.hidden = true;
    stage.hidden = false;
    // Enfocar solo en escritorio: en móvil abrir el teclado de golpe
    // tapa la tarjeta y desorienta.
    if (window.matchMedia('(min-width: 768px)').matches) email.focus();
  }

  // ── Arranque: ¿ya hay sesión? ──
  SVSession.restore()
    .then(function (s) {
      if (s) { SVSession.goToPanel(s.role); return; }
      showLogin();
    })
    .catch(showLogin);

  // ── Envío ──
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var user = email.value.trim().toLowerCase();
    var pwd  = pass.value;

    if (!user || !pwd) {
      showError('empty');
      (!user ? email : pass).focus();
      return;
    }

    setBusy(true);

    SVSession.login(user, pwd, remember.checked)
      .then(function (s) {
        var nombre = (s.user && s.user.nombre) ? s.user.nombre.split(' ')[0] : '';
        okEl.textContent = nombre
          ? ('Hola, ' + nombre + '. Abriendo tu panel…')
          : 'Listo. Abriendo tu panel…';
        okEl.hidden = false;
        // Pausa corta para que el saludo sea legible antes de navegar.
        setTimeout(function () { SVSession.goToPanel(s.role); }, 550);
      })
      .catch(function (err) {
        setBusy(false);
        showError(err && err.code);
        pass.value = '';
        pass.focus();
      });
  });

  // Limpiar el error en cuanto el usuario corrige algo.
  [email, pass].forEach(function (el) {
    el.addEventListener('input', function () {
      if (!errorEl.hidden) clearError();
    });
  });
})();
</script>
</body>
</html>
